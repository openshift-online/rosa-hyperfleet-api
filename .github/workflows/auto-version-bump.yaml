name: Auto version bump PR

on:
  push:
    branches:
      - main
    paths:
      - 'api/**/*.go'
      - 'api/go.mod'
      - 'api/go.sum'
      - 'clientset/**/*.go'
      - 'clientset/go.mod'
      - 'clientset/go.sum'
      - '!api/version.go'
      - '!clientset/version.go'

concurrency:
  group: auto-version-bump
  cancel-in-progress: false

jobs:
  create-version-bump-pr:
    name: Create version bump PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        module:
          - api
          - clientset
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check if module was modified
        id: changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^${{ matrix.module }}/'; then
            echo "modified=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.module }} was modified"
          else
            echo "modified=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.module }} was not modified, skipping"
          fi

      - name: Determine next version
        if: steps.changed.outputs.modified == 'true'
        id: version
        run: |
          LATEST=$(git tag -l '${{ matrix.module }}/v0.1.*' --sort=-version:refname | head -1)
          if [ -z "$LATEST" ]; then
            echo "next=${{ matrix.module }}/v0.1.1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PATCH=$(echo "$LATEST" | sed 's/${{ matrix.module }}\/v0\.1\.//')
          NEXT=$((PATCH + 1))
          echo "next=${{ matrix.module }}/v0.1.${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${LATEST}, next: ${{ matrix.module }}/v0.1.${NEXT}"

      - name: Update version.go and CHANGES.md
        if: steps.changed.outputs.modified == 'true'
        env:
          VERSION: ${{ steps.version.outputs.next }}
          MODULE: ${{ matrix.module }}
        run: |
          # Extract semver from module/vX.Y.Z
          SEMVER=$(echo "${VERSION}" | sed 's/.*\/v//')
          DATE=$(date '+%b %d %Y')

          # Update version.go
          sed -i "s/const Version = \".*\"/const Version = \"${SEMVER}\"/" ${MODULE}/version.go

          # Build changelog entry from commits affecting this module
          LATEST_TAG=$(git tag -l "${MODULE}/v0.1.*" --sort=-version:refname | head -1)
          if [ -n "$LATEST_TAG" ]; then
            CHANGES=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"- %s" --no-merges -- ${MODULE}/)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges -- ${MODULE}/)
          fi

          # Create CHANGES.md if it doesn't exist
          if [ ! -f "${MODULE}/CHANGES.md" ]; then
            echo "# Changes" > "${MODULE}/CHANGES.md"
            echo "" >> "${MODULE}/CHANGES.md"
          fi

          # Write changelog entry to a temp file
          {
            echo "## ${SEMVER} ${DATE}"
            echo ""
            echo "${CHANGES}"
            echo ""
          } > /tmp/changelog-entry.txt

          # Insert before the first existing ## entry
          awk 'NR==FNR{entry=entry $0 ORS; next} !inserted && /^## /{print entry; inserted=1} {print}' /tmp/changelog-entry.txt ${MODULE}/CHANGES.md > /tmp/CHANGES.md
          mv /tmp/CHANGES.md ${MODULE}/CHANGES.md

      - name: Check for changes
        if: steps.changed.outputs.modified == 'true'
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version changes needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changes detected:"
            git diff --stat
          fi

      - name: Create or update PR
        if: steps.changed.outputs.modified == 'true' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.next }}
          MODULE: ${{ matrix.module }}
        run: |
          BRANCH="release-${VERSION//\//-}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if an open PR already exists for this branch
          EXISTING_PR=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number' || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "Found existing PR #${EXISTING_PR} for branch ${BRANCH}, updating it"

            # Update existing branch
            git fetch origin "${BRANCH}"
            git checkout "${BRANCH}"
            git reset --hard origin/main
            git add ${MODULE}/version.go ${MODULE}/CHANGES.md
            git commit -m "chore(${MODULE}): bump version to ${VERSION}"
            git push --force-with-lease origin "${BRANCH}"

            echo "Updated existing PR #${EXISTING_PR}"
          else
            echo "No existing PR found, creating new one"

            # Check if branch exists remotely without a PR
            if git ls-remote --heads origin "${BRANCH}" | grep -q "${BRANCH}"; then
              echo "Stale branch ${BRANCH} exists without PR, deleting"
              git push origin --delete "${BRANCH}"
            fi

            # Create new branch and PR
            git checkout -b "${BRANCH}"
            git add ${MODULE}/version.go ${MODULE}/CHANGES.md
            git commit -m "chore(${MODULE}): bump version to ${VERSION}"
            git push origin "${BRANCH}"

            gh pr create \
              --title "chore(${MODULE}): bump version to ${VERSION}" \
              --body "## Auto-generated version bump

          This PR bumps the ${MODULE} module version to ${VERSION} and updates the changelog.

          ### Changes
          - Updated \`${MODULE}/version.go\` to ${VERSION}
          - Updated \`${MODULE}/CHANGES.md\` with commits since last release

          ### Review
          Once merged, the auto-tag-and-release workflow will create the git tag and GitHub release." \
              --base main \
              --head "${BRANCH}"
          fi