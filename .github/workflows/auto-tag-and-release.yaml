name: Auto-tag and release on version bump

on:
  push:
    branches:
      - main
    paths:
      - 'api/version.go'
      - 'clientset/version.go'

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  auto-tag-and-release:
    name: Create release tag and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        module:
          - api
          - clientset
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check if module was modified
        id: changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^${{ matrix.module }}/version\.go$'; then
            echo "modified=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.module }}/version.go was modified"
          else
            echo "modified=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.module }}/version.go was not modified, skipping"
          fi

      - name: Extract version from version.go
        if: steps.changed.outputs.modified == 'true'
        id: version
        run: |
          VERSION=$(grep 'const Version = ' ${{ matrix.module }}/version.go | sed 's/.*"\(.*\)".*/\1/')
          echo "version=${{ matrix.module }}/v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: ${{ matrix.module }}/v${VERSION}"

      - name: Validate version is new
        if: steps.changed.outputs.modified == 'true'
        id: validate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Check if tag already exists
          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${VERSION} already exists, skipping release"
            exit 0
          fi

          # Validate version format (module/v0.1.XXX)
          if ! echo "${VERSION}" | grep -qE '^(api|clientset)/v0\.1\.[0-9]+$'; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "Invalid version format: ${VERSION}"
            exit 0
          fi

          echo "is_new=true" >> "$GITHUB_OUTPUT"
          echo "Version ${VERSION} is valid and new"

      - name: Create tag
        if: steps.changed.outputs.modified == 'true' && steps.validate.outputs.is_new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "${VERSION}"
          git push origin "${VERSION}"

      - name: Setup Python
        if: steps.changed.outputs.modified == 'true' && steps.validate.outputs.is_new == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python modules
        if: steps.changed.outputs.modified == 'true' && steps.validate.outputs.is_new == 'true'
        run: pip install -r .github/workflows/requirements.txt

      - name: Create release
        if: steps.changed.outputs.modified == 'true' && steps.validate.outputs.is_new == 'true'
        shell: python
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MODULE: ${{ matrix.module }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import os
          import requests

          version_tag = os.environ["VERSION"]
          module = os.environ["MODULE"]
          repository = os.environ["REPOSITORY"]
          token = os.environ["TOKEN"]

          # Extract semver from module/vX.Y.Z
          version = version_tag.split("/v")[1]
          changelog_file = f"{module}/CHANGES.md"

          body = ""
          try:
              with open(changelog_file, "r") as stream:
                  while True:
                      line = stream.readline()
                      if line == "" or line.startswith("## " + version):
                          break
                  while True:
                      line = stream.readline()
                      if line == "" or line.startswith("## "):
                          break
                      body += line
          except FileNotFoundError:
              body = f"Release {version} for {module} module"

          response = requests.post(
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              json={
                  "tag_name": version_tag,
                  "name": version_tag,
                  "body": body,
              },
              url=(
                  "https://api.github.com"
                  f"/repos/{repository}/releases"
              ),
              timeout=(10, 30),
          )
          response.raise_for_status()