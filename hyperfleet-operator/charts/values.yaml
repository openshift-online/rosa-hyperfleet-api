replicaCount: 2

image:
  repository: quay.io/cbusse_openshift/hyperfleet-operator
  tag: ""
  pullPolicy: IfNotPresent

awsRegion: ""
baseDomain: ""

# sqsQueueUrlPrefix is the SQS queue URL prefix for the per-replica status
# queues. The pod ordinal (derived from the StatefulSet hostname) is appended
# to form the full queue URL, e.g.:
#   https://sqs.us-east-1.amazonaws.com/123456789012/regional-hyperfleet-operator-2
# Must end with a hyphen before the ordinal digit.
sqsQueueUrlPrefix: ""

postgres:
  secretName: postgres-dsn
  secretKey: dsn

serviceAccount:
  create: true
  name: hyperfleet-operator
  annotations: {}

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

compactor:
  enabled: true
  interval: 5m
  retention: 24h
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 32Mi

nodeSelector: {}
tolerations: []
