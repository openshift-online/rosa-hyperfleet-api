  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: oidcconfigs.hyperfleet.io
spec:
  group: hyperfleet.io
  names:
    kind: OidcConfig
    listKind: OidcConfigList
    plural: oidcconfigs
    shortNames:
    - hfoc
    singular: oidcconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OidcConfig is the Schema for the oidcconfigs API.
          It represents a reusable OIDC configuration for cluster identity.
          metadata.Name is the config ID; metadata.Namespace is account-<accountID>.
          Not exposed to REST clients — the platform API is flat (/oidc_configs) and
          derives the account from the caller's identity, not a URL parameter.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OidcConfigSpec defines the desired state of an OidcConfig.
            properties:
              accountId:
                description: AccountID is the AWS account that owns this OIDC config.
                type: string
              installerRoleArn:
                description: InstallerRoleArn is the ARN of the cross-account IAM
                  role used to read the customer's secret.
                pattern: ^arn:aws:iam::.*$
                type: string
              issuerUrl:
                description: IssuerUrl is the OIDC issuer URL, hosted by the customer.
                type: string
              secretArn:
                description: SecretArn is the ARN of the customer's Secrets Manager
                  secret containing the RSA private key.
                pattern: ^arn:aws:secretsmanager:.*$
                type: string
            required:
            - installerRoleArn
            - issuerUrl
            - secretArn
            type: object
            x-kubernetes-validations:
            - message: spec.secretArn is immutable
              rule: self.secretArn == oldSelf.secretArn
            - message: spec.installerRoleArn is immutable
              rule: self.installerRoleArn == oldSelf.installerRoleArn
            - message: spec.issuerUrl is immutable
              rule: self.issuerUrl == oldSelf.issuerUrl
          status:
            description: OidcConfigStatus defines the observed state of an OidcConfig.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest observations of the OIDC config's state.
                  Known condition types: Ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: Phase summarizes the OIDC config's lifecycle state.
                enum:
                - Pending
                - Ready
                - Error
                type: string
              thumbprint:
                description: |-
                  Thumbprint is the SHA-1 fingerprint of the OIDC issuer's TLS certificate.
                  Computed by the controller and refreshed periodically.
                type: string
