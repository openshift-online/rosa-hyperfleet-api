---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: dnsreservations.hyperfleet.io
spec:
  group: hyperfleet.io
  names:
    kind: DNSReservation
    listKind: DNSReservationList
    plural: dnsreservations
    shortNames:
    - hfdns
    singular: dnsreservation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.baseDomain
      name: BaseDomain
      type: string
    - jsonPath: .metadata.labels.hyperfleet\.io/cluster-namespace
      name: Cluster
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DNSReservation reserves a DNS prefix within a specific zone shard.
          Lives in the account namespace (account-<accountID>) for account isolation.
          Global uniqueness of the DNS prefix is guaranteed by the referenced Index
          resource in the shard's uniqueness namespace (dns-shard-<id>-reservations).
          Labels:
            - hyperfleet.io/account-id: AWS account that owns this reservation (always set).
            - hyperfleet.io/cluster-namespace: set when a cluster claims the reservation;
              absent for pre-reservations (e.g. shared-VPC flows).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DNSReservationSpec defines the desired state of a DNS reservation.
            properties:
              baseDomain:
                description: |-
                  BaseDomain is the fully assembled base domain for this reservation
                  (e.g. "f7a3.0.openshiftapps.com"). Used directly as the HostedCluster
                  BaseDomain. Computed at creation time as {prefix}.{shard}.{baseDomain},
                  where baseDomain is the operator's configured --base-domain.
                type: string
              clusterArch:
                description: ClusterArch identifies the cluster architecture that
                  can use this domain.
                type: string
              indexRef:
                description: |-
                  IndexRef references the Index resource in the shard's uniqueness
                  namespace that guarantees global uniqueness for this reservation's
                  prefix within the shard.
                properties:
                  name:
                    description: Name of the Index (the unique value, e.g. "f7a3").
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the Index (the uniqueness domain, e.g.
                      "dns-shard-0-reservations").
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              reservedAt:
                description: ReservedAt is the time when the domain was reserved.
                format: date-time
                type: string
              userDefined:
                description: UserDefined is true when the reservation was created
                  by a customer.
                type: boolean
            required:
            - baseDomain
            - indexRef
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
