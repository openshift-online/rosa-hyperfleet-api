metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: oidcissuerreservations.hyperfleet.io
spec:
  group: hyperfleet.io
  names:
    kind: OidcIssuerReservation
    listKind: OidcIssuerReservationList
    plural: oidcissuerreservations
    shortNames:
    - hfoir
    singular: oidcissuerreservation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.issuerUrl
      name: IssuerUrl
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OidcIssuerReservation reserves a globally unique OIDC issuer URL.
          Name = hex(SHA256(issuerUrl)), which maps arbitrary URLs to valid K8s names.
          The K8s API server enforces name uniqueness, preventing two configs
          from claiming the same issuer URL across all accounts.
          See OidcIssuerReservationName for collision probability analysis.
          Labels:
            - hyperfleet.io/account-id: AWS account that owns this reservation.
            - hyperfleet.io/oidcconfig-namespace: namespace of the owning OidcConfig.
            - hyperfleet.io/oidcconfig-name: name of the owning OidcConfig.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OidcIssuerReservationSpec defines the desired state of an
              OIDC issuer reservation.
            properties:
              issuerUrl:
                description: |-
                  IssuerUrl is the OIDC issuer URL being reserved.
                  Stored for display/debugging since the resource name is a hash.
                type: string
            required:
            - issuerUrl
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
